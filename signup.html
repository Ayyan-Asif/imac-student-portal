<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | IMAC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
  <div id="site-header"></div>
  <main class="auth-page">
    <div class="auth-card">
      <span class="eyebrow">JOIN IMAC</span>
      <h1>Create your account.</h1>
      <p class="muted">Demo registration is stored only in this browser.</p>
      <form id="signupForm" class="form-stack">
        <label>Full name<input id="signupName" type="text" minlength="2" placeholder="Ayyan Asif" required></label>
        <label>Email<input id="signupEmail" type="email" placeholder="student@example.com" required></label>
        <label>Password<input id="signupPassword" type="password" minlength="8" placeholder="Minimum 8 characters" required></label>
        <label>Confirm password<input id="signupConfirm" type="password" minlength="8" required></label>
        <div id="signupMessage" class="form-message hidden"></div>
        <button class="btn btn-primary full" type="submit">Create Account →</button>
      </form>
      <p class="auth-switch">Already registered? <a href="signin.html">Sign in</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
