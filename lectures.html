<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectures | IMAC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lectures">
  <div id="site-header"></div>
  <main class="section-wrap">
    <div class="page-title"><span class="eyebrow">LEARNING LIBRARY</span><h1>Lectures</h1><p>Choose a semester, then a course, then learn in chronological order.</p></div>
    <div id="lectureApp">
      <div class="choice-grid" id="semesterChoices"></div>
      <div id="courseSection" class="hidden section-block"><div class="section-heading compact"><h2>Choose a course</h2><span id="selectedSemester" class="tag"></span></div><div class="course-grid" id="courseChoices"></div></div>
      <div id="videoSection" class="hidden section-block"><div class="section-heading compact"><h2 id="videoTitle">Course videos</h2><button class="btn btn-small btn-outline" id="backToCourses">← Courses</button></div><div id="videoList"></div></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
