<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable | IMAC Portal</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="timetable">
  <div id="site-header"></div>
  <main class="section-wrap">
    <div class="page-title"><span class="eyebrow">ACADEMICS</span><h1>Timetable</h1><p>Find your classes and see what is coming next.</p></div>
    <div class="schedule-tools"><div class="semester-tabs" id="dayTabs"></div><div class="next-class-banner" id="nextClassBanner"></div></div>
    <div class="table-wrap"><table><thead><tr><th>Time</th><th>Course</th><th>Instructor</th><th>Room</th><th>Status</th></tr></thead><tbody id="timetableBody"></tbody></table></div>
    <div class="info-banner">💡 <strong>Demo data:</strong> The timetable is sample content for the project. An administrator could later connect it to a real database.</div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
